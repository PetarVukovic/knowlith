# Every push to main and every pull request — the same gate release uses.
#
# Release builds four binaries; this runs the tests once so a broken main
# is caught before anyone tags.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: knowlith/package-lock.json

      - run: npm ci
        working-directory: knowlith
      - run: npm test
        working-directory: knowlith
      - run: npm run lint
        working-directory: knowlith
      - run: npm run build
        working-directory: knowlith

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: sh -n install.sh
      - run: python3 scripts/test_installer.py
      - run: cargo test --workspace --locked -- --test-threads=2
