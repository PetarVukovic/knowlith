[workspace]
resolver = "3"
members = ["crates/core", "crates/extract", "crates/lake", "crates/graph", "crates/engine", "crates/compiler", "crates/desktop", "crates/mcp", "crates/server", "crates/worker", "crates/supervisor", "crates/cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Knowlith contributors"]

[workspace.dependencies]
knowlith-core = { path = "crates/core" }
knowlith-desktop = { path = "crates/desktop" }
knowlith-mcp = { path = "crates/mcp" }
knowlith-compiler = { path = "crates/compiler" }
knowlith-engine = { path = "crates/engine" }
knowlith-extract = { path = "crates/extract" }
knowlith-graph = { path = "crates/graph" }
knowlith-lake = { path = "crates/lake" }
knowlith-server = { path = "crates/server" }
knowlith-worker = { path = "crates/worker" }
knowlith-supervisor = { path = "crates/supervisor" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
calamine = { version = "0.36", features = ["dates"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
futures-util = "0.3"
getrandom = "0.4"
petgraph = "0.8"
portable-pty = "0.8"
walkdir = "2"
notify = "8.0"
encoding_rs = "0.8"
pdf-extract = "0.12"
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "sync", "time", "process"] }
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
thiserror = "2"
toml_edit = "0.23"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
